<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="payroll.css">
  <title>Payroll Display</title>
</head>
<body>

  <div class="box">
  <h1>Payroll Summary</h1>

  <div class="row"><span>ID:</span><span id="rId"></span></div>
  <div class="row"><span>Name:</span><span id="rName"></span></div>
  <div class="row"><span>Position:</span><span id="rPosition"></span></div>
  <div class="row"><span>Rate:</span><span id="rRate"></span></div>
  <div class="row"><span>Days Worked:</span><span id="rDays"></span></div>
  <div class="row"><span>Gross Pay:</span><span id="rGross"></span></div>
  <div class="row"><span>SSS:</span><span id="rSSS"></span></div>
  <div class="row"><span>Pag-IBIG:</span><span id="rPagibig"></span></div>
  <div class="row"><span>PhilHealth:</span><span id="rPhilhealth"></span></div>
  <div class="row"><span>Tax:</span><span id="rTax"></span></div>
  <div class="row total"><span>Total Deductions:</span><span id="rTotal"></span></div>
  <div class="row net"><span>Net Pay:</span><span id="rNet"></span></div>

    <a href="payrolls.html"><button onclick="back()">Back to Form</button></a>
  </div>

  <script src="payroll.js"></script>
